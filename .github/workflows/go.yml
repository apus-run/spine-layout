name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and business acceptance
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: spine_layout_acceptance
          MYSQL_ROOT_PASSWORD: acceptance-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify generation
        run: |
          make all
          git diff --exit-code -- api internal/conf internal/data/ent cmd/server/wire_gen.go openapi.yaml go.mod go.sum
      - name: Build and unit tests
        run: |
          make build
          go test -race ./...
          go vet ./...
      - name: Business acceptance with MySQL
        env:
          SPINE_LAYOUT_TEST_DSN: root:acceptance-only@tcp(127.0.0.1:3306)/spine_layout_acceptance?parseTime=true&loc=UTC&charset=utf8mb4
        run: go test -tags=integration -race -count=1 -timeout=4m -v ./cmd/server
      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
